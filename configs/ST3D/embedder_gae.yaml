case: L3

dataset:
  type: GraphST3D
  data_file: data/datasets/data_SUICA/ST3D/${case}.h5ad
  val_proportion: 0.2
  keep_ratio: True
  n_neighbors: 5

pipeline:
  embedder:
    model: GAE
    dim_hidden: [2048, 512, 64]
    dim_latent: 32

  optimization:
    seed: 8848
    epochs: 20
    lr: 1e-5
    val_freq: 10
    logs: logs/GAE/${case}
    batch_size: 512
  
  predict_mode: all
  embedded_data: embedded-all.h5ad
