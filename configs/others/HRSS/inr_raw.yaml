dataset:
  type: HRSS
  data_file: /data/datasets/HRSS/Cuprite.npz
  val_proportion: 0.2
  val_file: 

pipeline:
  target: raw_representations

  inr:
    model: FFN
    num_hidden_layers: 12
    num_hidden_features: 2048 
    decoder: # will be automatically updated

  optimization:
    seed: 8848
    epochs: 2000
    lr: 1e-5
    val_freq: 200
    logs: logs/inr_Cuprite_ffn
    batch_size: 2048

  predict_mode: 
  reconstructed_data: 