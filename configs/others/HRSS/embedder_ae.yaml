dataset:
  type: HRSS
  data_file: /data/datasets/HRSS/Cuprite.npz
  val_proportion: 0.2
  keep_ratio: True
  val_file: # if None, split data_file

pipeline:
  embedder:
    model: AE
    dim_hidden: [2048, 512, 64]
    dim_latent: 32

  optimization:
    seed: 8848
    epochs: 200
    lr: 1e-5
    val_freq: 100
    logs: logs/ae_Cuprite
    batch_size: 512
  
  predict_mode: all
  embedded_data: embedded-Cuprite.npz
