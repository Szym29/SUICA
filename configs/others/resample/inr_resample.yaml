dataset:
  type: ST2D
  h5ad_file: logs/ae_9.5/lightning_logs/version_0/train.h5ad
  val_proportion: 
  keep_ratio: True
  val_h5ad_file: logs/ae_9.5/lightning_logs/version_0/val.h5ad

pipeline:
  target: embeddings

  inr:
    model: FFN
    num_hidden_layers: 12
    num_hidden_features: 2048 
    decoder:
      ckpt: logs/ae_9.5/lightning_logs/version_0/checkpoints/last.ckpt
      recon_loss: True
      finetune: True
      
  optimization:
    seed: 8848
    epochs: 2000
    lr: 1e-5
    val_freq: 100
    logs: logs/inr_embd_9.5
    batch_size: 8192
  
  predict_mode: 
  reconstructed_data: 